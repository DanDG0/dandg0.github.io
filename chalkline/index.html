<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E4A3B">
<meta name="description" content="Lesson ideas, calendar planning, classroom themes and morning routines for teachers.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chalkline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<title>Chalkline Lesson Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column — sticky header, scrolling feed, fixed tab bar; lesson/profile screens slide over as full-height panels, bottom sheets for quick actions */
:root{
  --paper:#EDF1EC; --card:#FFFFFF; --ink:#15221D; --muted:#5A6962; --line:#D5DDD7;
  --board:#1E4A3B; --board-2:#163A2E; --board-soft:#DCE8E1; --on-board:#F2F6F1; --on-board-muted:#B9CCC2;
  --chalk:#F4D03F; --chalk-ink:#2A2300; --marker:#F4D03F;
  --danger:#B3402D; --ok:#2E7D55;
  --shadow:0 1px 2px rgba(16,35,28,.06),0 10px 28px rgba(16,35,28,.09);
  --scrim:rgba(10,20,16,.42);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --col:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1311; --card:#16201C; --ink:#E5ECE7; --muted:#95A49C; --line:#26322D;
    --board:#1F4A3B; --board-2:#183C30; --board-soft:#1C2D26; --on-board:#EEF4EF; --on-board-muted:#A9C2B6;
    --chalk:#F2D04A; --chalk-ink:#211B00; --marker:rgba(242,208,74,.34);
    --danger:#F08B74; --ok:#7FD1A4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1311; --card:#16201C; --ink:#E5ECE7; --muted:#95A49C; --line:#26322D;
  --board:#1F4A3B; --board-2:#183C30; --board-soft:#1C2D26; --on-board:#EEF4EF; --on-board-muted:#A9C2B6;
  --chalk:#F2D04A; --chalk-ink:#211B00; --marker:rgba(242,208,74,.34);
  --danger:#F08B74; --ok:#7FD1A4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--chalk);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svg.fill{fill:currentColor}

/* shell */
#app{max-width:var(--col);margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{font:800 24px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand .mk{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);padding:0 2px}
.brand small{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;border-radius:999px;padding:3px 3px 3px 10px;border:1px solid var(--line);background:var(--card)}
.me span{font-size:12px;font-weight:600;color:var(--muted)}
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--board);color:var(--on-board);font:700 13px/1 var(--f-body);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
main{padding-inline:16px;padding-block:4px 76px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:var(--col);margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px;position:relative}
.tab .svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:2px;width:44px;height:28px;border-radius:999px;background:var(--marker);z-index:-1}
.tab .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--board);color:var(--on-board);font-size:10px;line-height:17px;text-align:center}

.fab{position:fixed;z-index:7;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - var(--col)/2 + 16px));display:flex;align-items:center;gap:8px;background:var(--chalk);color:var(--chalk-ink);font-weight:700;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:var(--shadow)}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;transition:border-color .15s}
.search:focus-within{border-color:var(--board)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none;font-size:16px}
.search .svg{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.hint b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:hsl(var(--h,150) 55% 48%)}
.tag{display:inline-flex;font-size:12.5px;font-weight:600;color:var(--board);background:var(--board-soft);padding:3px 9px;border-radius:999px}
:root[data-theme="dark"] .tag{color:var(--on-board)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--on-board)}}
.tags{display:flex;flex-wrap:wrap;gap:6px}

section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}
.sec-h span{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* featured chalkboard cards */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;margin-inline:-16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.board{flex:none;width:min(78%,300px);scroll-snap-align:start;text-align:left;background:var(--board);color:var(--on-board);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:176px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 85% 10%,rgba(255,255,255,.07),transparent 45%),repeating-linear-gradient(-8deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px)}
.board .why{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk)}
.board h3{font:700 19px/1.2 var(--f-display)}
.board p{font-size:13px;color:var(--on-board-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board .meta{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--on-board-muted);font-variant-numeric:tabular-nums}

/* lesson rows */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.card .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.card .sub{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.card h3{font:700 16.5px/1.25 var(--f-display);letter-spacing:-.005em}
.card p.sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .tags{margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn.on{color:var(--board)}
.iconbtn:hover{background:var(--board-soft)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--marker);color:var(--ink)}

.empty{text-align:center;padding:36px 20px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font:700 18px/1.25 var(--f-display);color:var(--ink)}
.empty .glyph{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--board-soft);color:var(--board)}
.empty .glyph .svg{width:28px;height:28px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;border:1.5px solid var(--line);background:var(--card)}
.btn.primary{background:var(--board);border-color:var(--board);color:var(--on-board)}
.btn.chalk{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{color:var(--board);font-weight:700}
:root[data-theme="dark"] .link,:root[data-theme="dark"] .iconbtn.on{color:var(--chalk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link,:root:not([data-theme="light"]) .iconbtn.on{color:var(--chalk)}}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.cal-head h2{font:800 22px/1.1 var(--f-display);letter-spacing:-.02em}
.cal-nav{display:flex;gap:4px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;margin-top:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{aspect-ratio:1/1.05;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;position:relative}
.day.out{color:var(--muted);opacity:.45}
.day.today .n{background:var(--marker);border-radius:8px;padding:0 6px}
.day[aria-selected="true"]{background:var(--board);color:var(--on-board)}
.day[aria-selected="true"] .n{background:none}
.day .pips{display:flex;gap:3px;height:5px}
.day .pips i{width:5px;height:5px;border-radius:50%;background:var(--board)}
.day[aria-selected="true"] .pips i{background:var(--chalk)}
.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.ev .t{font:700 15px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.ev .t small{display:block;font:500 11.5px/1.3 var(--f-body);color:var(--muted);margin-top:3px}
.ev .b{min-width:0}
.ev .b b{display:block;font-weight:700;line-height:1.3}
.ev .b span{font-size:12.5px;color:var(--muted)}
.ev{border-left:4px solid hsl(var(--h,150) 55% 48%)}

/* overlay screens */
.screen{position:fixed;inset:0;z-index:20;max-width:var(--col);margin:0 auto;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.scr-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 6px;border-bottom:1px solid var(--line);background:var(--paper)}
.scr-head h2{flex:1;font:700 16px/1.2 var(--f-body);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-body{flex:1;overflow-y:auto;padding:18px 16px 28px;-webkit-overflow-scrolling:touch}
.scr-foot{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}

.d-sub{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.d-title{font:800 28px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:8px}
.d-sum{font-size:16px;color:var(--muted);margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:16px}
.facts div{padding:10px 12px;min-width:0}
.facts div+div{border-left:1px solid var(--line)}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;overflow-wrap:anywhere}
.sched{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;background:var(--board-soft);border-radius:12px;padding:10px 12px}
.video{margin-top:18px;display:block;border-radius:var(--r);overflow:hidden;background:var(--board-2);color:var(--on-board);text-decoration:none;position:relative;aspect-ratio:16/9;max-width:100%;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 24px)}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play span{width:64px;height:64px;border-radius:50%;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.video .play .svg{width:26px;height:26px;margin-left:4px}
.video .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.video .cap b{font:700 15px/1.25 var(--f-display);color:#F2F6F1}
.video .cap small{font-size:12px;color:#CFDCD4;white-space:nowrap}
.video .lbl{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#F2F6F1;padding:4px 8px;border-radius:6px}
.video.none{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;padding:16px;color:var(--on-board-muted);font-size:13.5px}
.d-sec{margin-top:24px}
.d-sec h3{font:700 17px/1.2 var(--f-display);margin-bottom:8px}
.d-sec p{white-space:pre-line;max-width:65ch}
.ticks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--chalk);margin-top:8px;flex:none;outline:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:10px 0;border-top:1px dashed var(--line);counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--board);color:var(--on-board);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps .m{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
.by{margin-top:24px;display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.by b{color:var(--ink)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:var(--col);background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:800 21px/1.2 var(--f-display);letter-spacing:-.01em}
.sheet .lead{color:var(--muted);margin-top:4px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:700}
.field .help{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--danger);font-weight:600}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--board)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
.prefix{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding-left:12px}
.prefix:focus-within{border-color:var(--board)}
.prefix span{color:var(--muted);font-weight:600}
.prefix .inp{border:0;background:none;padding-left:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.receipt{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums;margin-top:14px}
.receipt div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.receipt .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:16px}
.tabs.four{grid-template-columns:repeat(4,1fr)}
.tabs.five{grid-template-columns:repeat(5,1fr);padding-inline:2px}
.tabs.five .tab{font-size:11px}
.gtag{align-self:flex-start;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.gtag.on{background:var(--marker);border-color:transparent;color:var(--ink)}
.chip.locked{cursor:default;background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:.85}
.seg button{line-height:1.2}
.mini .ord{width:24px;height:24px;border-radius:50%;background:var(--board);color:var(--on-board);display:grid;place-items:center;font-size:12px;font-weight:700}
.th-by{font-size:13px;opacity:.9}
.th-create{margin-top:18px;background:var(--board-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.th-create p{color:var(--muted);font-size:14px}

.tc-motifs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.tc-m canvas{width:100%;aspect-ratio:1;border-radius:8px;display:block}
.tc-m[aria-pressed="true"]{border-color:var(--board);box-shadow:0 0 0 2px var(--board);color:var(--ink)}
.th-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th-card,.th-thumb{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 12px;min-width:0}
.th-card canvas{width:100%;aspect-ratio:3/2;border-radius:10px;display:block;background:var(--paper)}
.th-thumb canvas{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:10px;display:block;background:var(--paper);padding:6px}
.th-card b,.th-thumb b{font:700 15px/1.25 var(--f-display);padding:0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.th-card>span,.th-thumb>span{font-size:12.5px;color:var(--muted);padding:0 4px}
.th-card[aria-current="true"]{border-color:var(--board);box-shadow:0 0 0 2px var(--board)}
.th-hero{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.th-eye{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.th-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.th-row h2{font:800 26px/1.1 var(--f-display);letter-spacing:-.01em;min-width:0}
.th-change{font-weight:700;padding:8px 14px;border-radius:999px;flex:none}
.sw{display:flex;gap:6px}.sw i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

.th-big canvas{width:100%;height:auto;border-radius:10px;box-shadow:var(--shadow);display:block;background:var(--card)}
.seg.two{grid-template-columns:1fr 1fr}
.local{background:var(--board-soft);border-radius:var(--r);padding:14px 14px 10px}
.local .sec-h{margin-bottom:2px}
.local .link{display:inline-flex;align-items:center;gap:2px;font-size:14px}

.minis{display:flex;flex-direction:column;margin-top:8px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 2px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);width:100%}
.mini:first-child{border-top:0}

.note{font-size:12.5px;color:var(--muted);background:var(--paper);border-radius:10px;padding:9px 11px}

.prof-top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 0 4px}
.avwrap{position:relative}
.avwrap .cam{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;border:3px solid var(--paper)}
.prof-top h2{font:800 24px/1.15 var(--f-display)}

.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.group .gi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;width:100%;text-align:left}

.gi .k{font-weight:600}

.stats b{display:block;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.grp-h{margin-top:22px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:4px}

.onb{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto}

.pick{display:flex;flex-wrap:wrap;gap:8px}
#splash{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;font:800 26px/1 var(--f-display)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

// A demo link must point at one video, not a search page or channel.
function isSpecificVideo(u) {
  try {
    const x = new URL(u), h = x.hostname.replace(/^(www|m)\./, "");
    if (h === "youtube.com") return (x.pathname === "/watch" && !!x.searchParams.get("v")) || /^\/(shorts|live|embed)\/[\w-]{6,}/.test(x.pathname);
    if (h === "youtu.be") return x.pathname.length > 6;
    if (h === "vimeo.com") return /^\/\d+/.test(x.pathname);
    return !(/\/(results|search)\b/i.test(x.pathname) || x.searchParams.has("search_query") || x.searchParams.has("q"));
  } catch (e) { return false; }
}

// Under-10s ≈ Grade R/Kindergarten (0) to Grade 4.
const UNDER10_MAX = 4;

// Stages after Primary, named the way each country names them. Ranges use internal grades (0 = Grade R / K).
const TIERS = {
  ZA: [["Intermediate Phase", [4, 7]], ["High School", [8, 12]]], NG: [["Upper Primary", [4, 6]], ["Secondary School", [7, 12]]], KE: [["Junior School", [7, 9]], ["Senior School", [10, 12]]],
  US: [["Middle School", [5, 8]], ["High School", [9, 12]]], CA: [["Middle School", [5, 8]], ["High School", [9, 12]]], BR: [["Middle School", [6, 9]], ["High School", [10, 12]]],
  GB: [["Upper Primary", [3, 5]], ["Secondary School", [6, 12]]], IE: [["Senior Primary", [3, 5]], ["Secondary School", [6, 12]]], DE: [["Upper Primary", [3, 4]], ["Secondary School", [5, 12]]],
  NL: [["Upper Primary", [4, 6]], ["Secondary School", [7, 12]]], IN: [["Middle School", [6, 8]], ["Secondary School", [9, 12]]], SG: [["Upper Primary", [4, 6]], ["Secondary School", [7, 12]]],
  PH: [["Junior High School", [7, 10]], ["Senior High School", [11, 12]]], JP: [["Junior High School", [7, 9]], ["Senior High School", [10, 12]]], AE: [["Middle School", [5, 8]], ["High School", [9, 12]]],
  AU: [["Upper Primary", [4, 6]], ["High School", [7, 12]]], NZ: [["Intermediate", [6, 7]], ["Secondary School", [8, 12]]],
};
const tiersFor = cc => { const t = TIERS[cc] || TIERS.US; return { mid: { name: t[0][0], r: t[0][1] }, high: { name: t[1][0], r: t[1][1] } }; };
const phaseName = (ph, cc) => ph === "primary" ? "Primary" : tiersFor(cc)[ph].name;
const phaseRange = (ph, cc) => ph === "primary" ? [0, UNDER10_MAX] : tiersFor(cc)[ph].r;
function rangeText(r, sys) {
  const a = gradeOne(r[0], sys), b = gradeOne(r[1], sys), ma = a.match(/^(.*?) (\d+)$/), mb = b.match(/^(.*?) (\d+)$/);
  if (ma && mb && ma[1] === mb[1]) return ({ Grade: "Grades", Year: "Years", Class: "Classes" }[ma[1]] || ma[1]) + " " + ma[2] + "–" + mb[2];
  return a + "–" + b;
}
const phaseHelp = (ph, cc) => ph === "primary" ? `All subjects, for children under 10 (${rangeText([0, UNDER10_MAX], COUNTRIES[cc].grade)}). Unlocks the Themes and Morning routine tabs.` : `${phaseName(ph, cc)}: ${rangeText(phaseRange(ph, cc), COUNTRIES[cc].grade)}. Pick the subjects you teach below.`;
const gradeTag = (g, sys) => g[0] === g[1] ? gradeOne(g[0], sys) : rangeText(g, sys);
const myGrade = () => S.profile?.phase === "primary" ? S.profile.grade : null;
const forMyGrade = g => myGrade() !== null && g[0] <= myGrade() && g[1] >= myGrade();
function gradePicker(sel, sys) { return Array.from({ length: UNDER10_MAX + 1 }, (_, i) => `<button type="button" class="chip" data-gr="${i}" aria-pressed="${i === sel}">${esc(gradeOne(i, sys))}</button>`).join(""); }
const ageFiltered = () => !ui.allAges;
const inPhase = l => { const r = phaseRange(S.profile.phase, S.profile.country); return l.grades[0] <= r[1] && l.grades[1] >= r[0]; };
const ageOk = l => !ageFiltered() || inPhase(l);

// Main feed relevance is worldwide: phase/subjects and how universal a plan is. Country only drives the local block.

  if (inPhase(l)) { s += 3; why = why || (p.phase === "primary" ? "Great for under-10s" : "Right for " + phaseName(p.phase, p.country)); }

  $("#view").innerHTML = `
    <label class="search" for="q">${I.search}<input id="q" type="search" autocomplete="off" placeholder="Search #fractions or keywords" value="${esc(ui.q)}"><button class="iconbtn" id="q-clear" aria-label="Clear search" ${ui.q ? "" : "hidden"}>${I.x}</button></label>

const screens = [];
function pushScreen(build) {
  const el = document.createElement("div"); el.className = "screen"; el.setAttribute("role", "dialog");
  $("#screens").appendChild(el);
  const scr = { el, build, refresh() { const st = el.querySelector(".scr-body")?.scrollTop || 0; build(el, scr); const b = el.querySelector(".scr-body"); if (b) b.scrollTop = st; } };
  screens.push(scr); build(el, scr); document.body.style.overflow = "hidden";
  return scr;
}
function popScreen() {
  const s = screens.pop(); if (s) s.el.remove();
  if (!screens.length) { document.body.style.overflow = ""; renderTab(); }
}

/* ---------- uploads ---------- */
async function writeMyLessons(items) {
  const body = { items };
  if (JSON.stringify(body).length > 240000) throw { code: "too_big" };
  await db.doc(`lessons/${uid}`).set(body);
  myRemote = items;
}
async function publishLesson(item) {
  if (db && uid) {
    try { await writeMyLessons([...myRemote, item]); toast("Published to Lessons"); return true; }
    catch (e) {
      if (e?.code === "too_big") { toast("You’ve reached the upload limit. Remove an older lesson first."); return false; }
      if (e?.code === "quota_exceeded") { toast("The lesson library is full right now."); return false; }
    }
  }
  S.myUploads.push(item); persist();
  toast("Saved on this device. Others can’t see it until you have upload access.");
  return true;
}
async function deleteLesson(l) {
  if (l.local) { S.myUploads = S.myUploads.filter(x => x.id !== l.rawId); persist(); }
  else if (l.owner === uid) { await writeMyLessons(myRemote.filter(x => x.id !== l.rawId)); }
  else if (isOwner) { const snap = await db.doc(`lessons/${l.owner}`).get(); const items = (snap.data()?.items || []).filter(x => x.id !== l.rawId); await db.doc(`lessons/${l.owner}`).set({ items }); }
  S.saves = S.saves.filter(x => x !== l.id); S.calendar = S.calendar.filter(e => e.lessonId !== l.id); persist();
}

        <div class="field"><label for="m-g2">To</label><select class="inp" id="m-g2">${Array.from({ length: UNDER10_MAX + 1 }, (_, i) => `<option value="${i}" ${i === S.profile.grade ? "selected" : ""}>${esc(gradeOne(i, C().grade))}</option>`).join("")}</select></div></div>

    $("#f-mr", el).addEventListener("submit", async e => {
      e.preventDefault();

      err.hidden = true;
      const item = { id: uidLocal("r"), title: v("#m-title"), summary: v("#m-sum"), cat: v("#m-cat"), minutes: +v("#m-min") || 5, grades: [Math.min(+v("#m-g1"), +v("#m-g2")), Math.max(+v("#m-g1"), +v("#m-g2"))], description: v("#m-desc"),

}

/* ---------- global events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.tabGo) { while (screens.length) popScreen(); return setTab(d.tabGo); }
  if (d.save) { e.stopPropagation(); return toggleSave(d.save); }
  if (d.themePick) return pickTheme(d.themePick);
  if (d.mrAdd) { e.stopPropagation(); return toggleRoutine(d.mrAdd); }
  if (d.mr) return openRoutine(d.mr);
  if (d.mrCat) { ui.mrCat = d.mrCat; $$("[data-mr-cat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mrCat === ui.mrCat)); return mrResults(); }
  if (d.mrTag) { while (screens.length) popScreen(); ui.mq = "#" + d.mrTag; ui.mrCat = "All"; return setTab("morning"); }
  if (d.mrDel) { const r = getRoutine(d.mrDel); if (!r) return; return confirmSheet("Remove this activity?", "It will disappear from Morning routine for everyone.", "Remove", async () => { try { await removeItem("routines", r); S.routine = S.routine.filter(x => x !== r.id); persist(); toast("Activity removed"); popScreen(); rerender(); } catch (er) { toast("Couldn’t remove it. Try again in a moment."); } }); }
  if (d.thDel) { const th = getTheme(d.thDel); if (!th) return; return confirmSheet("Remove this theme?", "It will disappear for every teacher using it.", "Remove", async () => { try { await removeItem("themes", th); communityThemes = communityThemes.filter(x => x.id !== th.id); S.themeSel = null; persist(); toast("Theme removed"); renderThemes(); } catch (er) { toast("Couldn’t remove it. Try again in a moment."); } }); }
  if (d.thItem) return openThemeItem(d.thItem);
  if (d.thDl) return downloadThemeItem(d.thDl, t);
  if (d.open) return openLesson(d.open);
  if (d.addcal) return addToCalendarSheet(d.addcal);
  if (d.tag) { while (screens.length) popScreen(); ui.q = "#" + d.tag; ui.subject = "All"; return setTab("lessons"); }
  if (d.subj) { ui.subject = d.subj; $$("[data-subj]").forEach(b => b.setAttribute("aria-pressed", b.dataset.subj === ui.subject)); return updateResults(); }
  if ("back" in d) return popScreen();
  if (d.cal) {
    if (d.cal === "today") { const t0 = isoDate(new Date()); ui.calMonth = t0.slice(0, 7); ui.calSel = t0; }
    else { const [y, m] = ui.calMonth.split("-").map(Number); const n = new Date(y, m - 1 + +d.cal, 1); ui.calMonth = isoDate(n).slice(0, 7); ui.calSel = isoDate(n); }
    return renderCalendar();
  }
  if (d.day) { ui.calSel = d.day; if (d.day.slice(0, 7) !== ui.calMonth) ui.calMonth = d.day.slice(0, 7); return renderCalendar(); }
  if (d.themeSet) { S.settings.theme = d.themeSet; persist(); applyTheme(); return rerender(); }
  if (d.del) {
    const l = getLesson(d.del); if (!l) return;
    return confirmSheet(isMine(l) ? "Remove your lesson?" : "Remove this lesson?", isMine(l) ? "It will disappear from Lessons for everyone, including anyone who saved it." : "It will be taken off the public listings for everyone.", "Remove", async () => {
      try { await deleteLesson(l); toast("Lesson removed"); popScreen(); rerender(); } catch (er) { toast("Couldn’t remove the lesson. Try again in a moment."); }
    });
  }
  switch (d.act) {
    case "upload": closeSheet(); return openUpload();
    case "more-local": return openLocal();
    case "th-create": return openThemeCreate();
    case "mr-create": return openRoutineCreate();
    case "th-browse": ui.themeBrowse = true; renderThemes(); return window.scrollTo(0, 0);
    case "th-back": ui.themeBrowse = false; return renderThemes();
    case "ages": ui.allAges = !ui.allAges; return rerender();
    case "phase": return phaseSheet();
    case "photo": avatarTarget = null; return $("#file-av").click();
    case "rm-photo": S.profile.avatar = ""; persist(); rerender(); return renderMe();
    case "name": return editNameSheet();
    case "username": return usernameSheet();
    case "country": return countrySheet();
    case "subjects": return subjectsSheet();
    case "fb-signout": return confirmSheet("Sign out?", "Your plans stay safe in your account. Sign in again on any device to get them back.", "Sign out", fbSignOut);
    case "fb-signin": return fb.signIn().then(ok => { if (ok) { setGuest(false); location.reload(); } }, x => toast(signInError(x)));
    case "reset": return confirmSheet("Sign out and erase?", "Your profile, saves and calendar are deleted. Lessons you shared stay in the public listings.", "Erase my data", () => {
      S = blank(); persist(); while (screens.length) popScreen(); applyTheme(); showOnboarding();
    });
  }
});

function subscribeCommunity() {

    snap.docs.forEach(doc => { const items = doc.data()?.items; if (Array.isArray(items)) items.forEach(it => { const l = normalize(it, doc.id, false); if (l) out.push(l); }); if (doc.id === uid) myRemote = Array.isArray(items) ? items.slice() : []; });
    community = out; communityStatus = "live"; rerender(); updateBadges();

}

const FIREBASE_CONFIG = { apiKey: "AIzaSyCYwpQAzVo4awdT3AzVSVPb8RzltHtgOVo", authDomain: "chalkline-4eb8a.firebaseapp.com", projectId: "chalkline-4eb8a", storageBucket: "chalkline-4eb8a.firebasestorage.app", messagingSenderId: "552153697344", appId: "1:552153697344:web:c35947c77f6376805aa3a5" };

const isGuest = () => { try { return localStorage.getItem(GUEST_KEY) === "1"; } catch (e) { return false; } };
const setGuest = v => { try { v ? localStorage.setItem(GUEST_KEY, "1") : localStorage.removeItem(GUEST_KEY); } catch (e) { } };
async function firebaseBackend(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(cfg), auth = A.getAuth(app), fs = F.getFirestore(app);
  await A.getRedirectResult(auth).catch(() => { });
  const user = await new Promise(r => { const off = A.onAuthStateChanged(auth, u => { off(); r(u); }); });
  // Same small surface the app uses from Claude's db capability.
  const err = e => { const c = String(e?.code || ""); throw { code: c.includes("permission") ? "invalid_argument" : c.includes("exhausted") ? "quota_exceeded" : "unavailable", message: e?.message || "" }; };
  const snapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  const dbA = {
    doc: path => ({ get: () => F.getDoc(F.doc(fs, path)).then(snapDoc, err), set: data => F.setDoc(F.doc(fs, path), data).catch(err) }),
    collection: path => ({ onSnapshot: (next, onErr) => F.onSnapshot(F.collection(fs, path), s => next({ docs: s.docs.map(snapDoc) }), e => onErr && onErr(e)) }),
  };
  const isAdmin = () => user ? F.getDoc(F.doc(fs, "meta", "admin")).then(() => true, () => false) : Promise.resolve(false);
  return {
    user, db: dbA, isAdmin,
    async signIn() {
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
      try { await A.signInWithPopup(auth, p); return true; }
      catch (e) {
        const c = String(e?.code || "");
        if (c.includes("popup-blocked") || c.includes("operation-not-supported")) { await A.signInWithRedirect(auth, p); return false; }
        if (c.includes("popup-closed") || c.includes("cancelled-popup")) return false;
        throw e;
      }
    },
    signOut: () => A.signOut(auth),
  };
}

function signInError(x) {
  const c = String(x?.code || "");
  if (c.includes("configuration-not-found") || c.includes("operation-not-allowed")) return "Google sign-in isn’t switched on for this app yet (Firebase → Authentication → Sign-in method → Google). Use “Continue as guest” for now.";
  if (c.includes("unauthorized-domain")) return "This web address isn’t approved for sign-in yet (Firebase → Authentication → Settings → Authorized domains).";
  if (c.includes("network")) return "No internet connection. Check your connection and try again.";
  return "Sign-in didn’t work" + (c ? ` (${c.replace("auth/", "")})` : "") + ". If you opened this inside another app, open it in Chrome or Safari and try again.";
}
async function fbSignOut() { try { await fb.signOut(); } catch (e) { } try { localStorage.removeItem(LS_KEY); } catch (e) { } setGuest(false); location.reload(); }

async function boot() {
  const local = hydrate(lsRead()); S = local; applyTheme();
  if (window.claude && typeof window.claude.use === "function") {
    const within = (p, ms) => Promise.race([p.catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
    try {
      [db, userCap] = await Promise.all([within(window.claude.use("db"), 6000), within(window.claude.use("user"), 6000)]);
      if (userCap) { uid = await userCap.id(); isOwner = await userCap.isOwner(); }
      if (db && uid) {
        const snap = await db.doc(`data/users/${uid}/state`).get();
        mode = "cloud";
        if (snap.exists) S = hydrate(snap.data()); else if (local.profile) persist();
      }
      if (db) { subscribeCommunity(); subscribeColl("themes", normTheme, o => communityThemes = o); subscribeColl("routines", normRoutine, o => communityRoutines = o); }
    } catch (e) { mode = "local"; }
  } else if (FIREBASE_CONFIG) {
    try {
      fb = await firebaseBackend(FIREBASE_CONFIG); db = fb.db;
      if (fb.user) {
        uid = fb.user.uid; isOwner = await fb.isAdmin();
        const snap = await db.doc(`data/users/${uid}/state`).get();
        mode = "cloud";
        if (snap.exists) S = hydrate(snap.data()); else if (local.profile) persist();
      }
      subscribeCommunity(); subscribeColl("themes", normTheme, o => communityThemes = o); subscribeColl("routines", normRoutine, o => communityRoutines = o);
      if (!fb.user && !isGuest()) { applyTheme(); $("#splash").hidden = true; return showSignIn(); }
    } catch (e) { mode = "local"; if (!fb) db = null; setTimeout(() => toast("Can’t reach the shared library right now. Your changes are kept on this device."), 800); }
  }
  lsWrite(); applyTheme();
  $("#splash").hidden = true;
  if (!S.profile) showOnboarding(); else showApp();
}
boot();
