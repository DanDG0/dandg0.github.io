<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daniel de Gois</title>
<meta name="description" content="Drummer and developer. Web apps, games and software by Daniel de Gois.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>try{var t=localStorage.getItem("portfolio-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
/* Layout: left-aligned intro, sticky tab bar, then a grid of project link cards. */
:root{
  --bg:#F5F7FA; --surface:#EEF1F5; --raised:#FFFFFF; --ink:#111827; --muted:#5B6474; --line:#DDE2E9;
  --brass:#1F4FD1; --brass-ink:#FFFFFF; --brass-soft:#E3EAFB;
  --shell:#141A26; --shell-ink:#E8ECF3; --shell-dim:#2A3346; --shell-mute:#8F9AB0;
  --danger:#B42318; --ok:#1F7A4D;
  --display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1017; --surface:#121824; --raised:#161D2A; --ink:#E7EBF2; --muted:#98A2B5; --line:#253044;
  --brass:#7EA2FF; --brass-ink:#0B1530; --brass-soft:#1A2644;
  --shell:#0F1520; --shell-ink:#E8ECF3; --shell-dim:#26304A; --shell-mute:#8792AA;
  --danger:#FF8A80; --ok:#6FD3A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1017; --surface:#121824; --raised:#161D2A; --ink:#E7EBF2; --muted:#98A2B5; --line:#253044;
  --brass:#7EA2FF; --brass-ink:#0B1530; --brass-soft:#1A2644;
  --shell:#0F1520; --shell-ink:#E8ECF3; --shell-dim:#26304A; --shell-mute:#8792AA;
  --danger:#FF8A80; --ok:#6FD3A0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--shell);color:var(--brass);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.02em}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

/* hero */
.hero{padding-block:clamp(44px,8vw,96px) clamp(32px,5vw,56px);max-width:860px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,84px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.lede{font-size:clamp(18px,2vw,22px);max-width:40ch;margin:20px 0 0;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

/* sections */
.view{padding-block:8px 96px}
.sec-head{display:flex;align-items:end;gap:16px 24px;flex-wrap:wrap;margin-bottom:24px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.6vw,38px);line-height:1.1;margin:0;letter-spacing:-.02em}
.count-badge{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:8px;vertical-align:middle}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--ink)}

.quick{display:flex;gap:8px;margin-bottom:24px;background:var(--surface);border:1px dashed var(--brass);border-radius:var(--r);padding:12px;flex-wrap:wrap}
.quick input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:9px 12px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px}
.card{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -20px rgba(10,14,30,.45);border-color:color-mix(in srgb,var(--brass) 50%,var(--line))}
.card.feat{grid-column:span 2}
@media (max-width:700px){.card.feat{grid-column:auto}}
.card-link{display:flex;flex-direction:column;text-decoration:none;color:inherit;height:100%}
.cover{aspect-ratio:16/8;background:var(--shell);position:relative;overflow:hidden}
.card.feat .cover{aspect-ratio:16/6.4}
@media (max-width:700px){.card.feat .cover{aspect-ratio:16/8}}
.cover img,.cover svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.flag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(10,12,20,.72);color:#fff}
.flag.feat-flag{left:auto;right:10px;background:var(--brass);color:var(--brass-ink)}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0}
.cat{color:var(--brass);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;white-space:nowrap}
.dom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3{font-size:20px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:auto 0 0;padding:6px 0 0}
.tags li{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.open{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink);margin-top:4px}
.card:hover .open{color:var(--brass)}
.tools{display:flex;gap:6px;padding:10px 12px;border-top:1px dashed var(--line);background:var(--surface);flex-wrap:wrap}
.tools .spacer{flex:1}

.empty{border:1px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:20px}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
.prose p{font-size:18px;max-width:62ch;margin:0 0 1em}
.prose p:first-child{font-size:21px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h3{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 10px;font-weight:600}
.panel p{margin:0 0 12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.pills li{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.kit{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kit li{display:flex;gap:10px;font-size:15px}
.kit li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brass);margin-top:8px;flex:none}
.contact{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.contact a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
.contact a span:last-child{color:var(--muted);font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mail code{font-family:var(--mono);font-size:14px;user-select:all;overflow-wrap:anywhere}

.closing{border-top:1px solid var(--line);padding-block:48px 56px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
.closing h2{font-size:clamp(24px,3vw,30px);margin-bottom:12px}
.closing p{color:var(--muted);margin:0 0 14px;max-width:58ch}
.link{color:var(--brass);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:15px}
.link:hover{text-decoration:underline}
.contact-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.contact-list li{display:flex;align-items:center;gap:12px;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.contact-list .ic{width:36px;height:36px;border-radius:9px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:none}
.contact-list .ic svg{width:18px;height:18px}
.contact-list .tx{display:grid;min-width:0;flex:1}
.contact-list .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.contact-list a.val{font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.contact-list a.val:hover{color:var(--brass)}
.theme{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.theme svg{width:18px;height:18px}
.theme:hover{border-color:var(--muted)}
@media (max-width:760px){.closing{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* edit mode */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--shell);color:var(--shell-ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.editbar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-inline:0}
.editbar .status{margin-right:auto;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--shell-mute)}
.dot.dirty{background:var(--brass)}
.editbar .btn{background:transparent;color:var(--shell-ink);border-color:var(--shell-dim)}
.editbar .btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.banner{background:var(--brass-soft);border:1px solid var(--brass);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.banner span{margin-right:auto}

.modal-back{position:fixed;inset:0;z-index:50;background:rgba(8,10,18,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--raised);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px}
.modal h2{font-size:32px;margin-bottom:4px}
.modal .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.fields{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.f input[type=text],.f input[type=url],.f input[type=email],.f input[type=number],.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:400;font-size:15px}
.f textarea{resize:vertical;min-height:84px;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.imgrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.thumb{width:120px;aspect-ratio:16/8;border-radius:8px;overflow:hidden;background:var(--shell);position:relative;flex:none}
.thumb img,.thumb svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:0}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}

@media (max-width:860px){.about{grid-template-columns:1fr}}
@media (max-width:480px){.tabs .tab{padding:6px 11px}.top .wrap{gap:10px;flex-wrap:nowrap}.brand span:last-child{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.card:hover{transform:none}}
body.editing{padding-bottom:84px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var DRAFT_KEY='portfolio-draft-v1';
var S={
  data:null, savedJSON:'', loadMsg:'Loading…',
  tab:(location.hash==='#about')?'about':'projects',
  filter:'All', canEdit:false, editing:false, saving:false,
  draft:null, confirmDel:null
};
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dirty(){return JSON.stringify(S.data)!==S.savedJSON}
function $(sel,root){return (root||document).querySelector(sel)}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{var x=new URL(u);if(x.protocol!=='http:'&&x.protocol!=='https:')return '';return x.href}catch(e){return ''}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function guessTitle(u){try{var x=new URL(u);var parts=x.pathname.split('/').filter(Boolean);var h=x.hostname.replace(/^www\./,'');var base;
  if(/github\.io$/.test(h)) base=parts[0]||h.split('.')[0];
  else if(/github\.com$|itch\.io$|vercel\.app$|netlify\.app$|pages\.dev$/.test(h)) base=parts[parts.length-1]||h.split('.')[0];
  else base=h.split('.')[0];
  return base.replace(/[-_]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()})}catch(e){return ''}}
function list(s){return String(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean)}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed=(seed+0x6D2B79F5)|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Each project gets a generated cover: a calm colour field with a browser-window motif */
var COVERS=[['#1E3A8A','#2F5BD3'],['#0F4C5C','#1B7F8C'],['#27303F','#4A5568'],['#3B2F6B','#5B4BB0'],['#14532D','#23784A'],['#5B2140','#8A3A63']];
function coverSVG(p){
  var h=hash((p.title||'')+(p.url||'')),c=COVERS[h%COVERS.length],W=320,H=160,id='g'+h;
  var ini=esc(String(p.title||'?').trim().charAt(0).toUpperCase()||'?');
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient><pattern id="d'+id+'" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,.14)"/></pattern></defs><rect width="'+W+'" height="'+H+'" fill="url(#'+id+')"/><rect width="'+W+'" height="'+H+'" fill="url(#d'+id+')"/>';
  s+='<g transform="translate(70 30)"><rect width="180" height="112" rx="8" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.28)"/><rect width="180" height="18" rx="8" fill="rgba(255,255,255,.16)"/><circle cx="11" cy="9" r="2.6" fill="rgba(255,255,255,.7)"/><circle cx="20" cy="9" r="2.6" fill="rgba(255,255,255,.5)"/><circle cx="29" cy="9" r="2.6" fill="rgba(255,255,255,.35)"/>';
  s+='<text x="22" y="74" font-family="Manrope,Segoe UI,sans-serif" font-weight="800" font-size="38" fill="#fff">'+ini+'</text><rect x="70" y="44" width="88" height="7" rx="3.5" fill="rgba(255,255,255,.55)"/><rect x="70" y="58" width="64" height="7" rx="3.5" fill="rgba(255,255,255,.3)"/><rect x="70" y="72" width="76" height="7" rx="3.5" fill="rgba(255,255,255,.3)"/><rect x="22" y="90" width="44" height="12" rx="6" fill="rgba(255,255,255,.8)"/></g></svg>';
  return s}
function coverHTML(p){return p.image?'<img src="'+esc(p.image)+'" alt="">':coverSVG(p)}

/* ---------- render ---------- */
function render(){
  if(!S.data){document.getElementById('app').innerHTML='<div class="wrap" style="padding-block:96px;color:var(--muted)">'+esc(S.loadMsg)+'</div>';return}
  var d=S.data,P=d.profile;
  document.title=P.name||'Portfolio';
  var app=document.getElementById('app');
  var h='';
  h+='<header class="top"><div class="wrap"><a class="brand" href="#projects" data-tab="projects"><span class="mark">'+esc(P.initials||initials(P.name))+'</span><span>'+esc(P.name)+'</span></a>';
  h+='<nav class="tabs" role="tablist" aria-label="Sections"><a href="#projects" class="tab" role="tab" data-tab="projects" aria-selected="'+(S.tab==='projects')+'">Projects</a><a href="#about" class="tab" role="tab" data-tab="about" aria-selected="'+(S.tab==='about')+'">About me</a></nav>';
  h+=themeBtn();
  if(S.canEdit&&!S.editing) h+='<button class="btn sm" id="startEdit" type="button">Edit site</button>';
  h+='</div></header>';
  h+='<div class="wrap">';
  if(S.draft&&S.canEdit) h+='<div class="banner"><span>You have unsaved edits from an earlier session.</span><button class="btn sm primary" id="restore" type="button">Restore them</button><button class="btn sm ghost" id="dropDraft" type="button">Discard</button></div>';
  h+='<section class="hero"><div><p class="eyebrow">'+esc(P.role)+'</p><h1>'+esc(P.name)+'</h1><p class="lede">'+esc(P.tagline)+'</p><div class="facts">';
  var real=d.projects.filter(function(p){return !p.sample}).length;
  if(real) h+='<span><b>'+real+'</b> project'+(real===1?'':'s')+'</span>';
  if(P.location) h+='<span>Based in <b>'+esc(P.location)+'</b></span>';
  if(P.now) h+='<span>Now: <b>'+esc(P.now)+'</b></span>';
  h+='</div></div></section>';
  h+=S.tab==='about'?aboutHTML():projectsHTML();
  h+=closingHTML();
  h+='</div>';

/* ---------- saving to GitHub ---------- */
var GH_KEY='portfolio-github-v1';
function ghCfg(){try{var c=JSON.parse(localStorage.getItem(GH_KEY)||'null');return c&&c.token?c:null}catch(e){return null}}
function ghSetCfg(c){try{if(c)localStorage.setItem(GH_KEY,JSON.stringify(c));else localStorage.removeItem(GH_KEY)}catch(e){}}
function guessRepo(){var h=location.hostname.toLowerCase(),m=h.match(/^([^.]+)\.github\.io$/);if(!m)return {owner:'',repo:''};var seg=location.pathname.split('/').filter(Boolean)[0];return {owner:m[1],repo:(seg&&!/\.html?$/.test(seg))?seg:h}}
function ghFetch(cfg,url,opts){opts=opts||{};return fetch('https://api.github.com'+url,{method:opts.method||'GET',cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){
  if(r.status===404&&opts.allow404)return null;
  return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.message||('GitHub error '+r.status));e.status=r.status;throw e}return j})})}
function ghPath(cfg,path){return '/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path}
function ghGet(cfg,path){return ghFetch(cfg,ghPath(cfg,path)+'?ref='+encodeURIComponent(cfg.branch),{allow404:true})}
function ghPut(cfg,path,b64,msg){return ghGet(cfg,path).then(function(cur){var body={message:msg,content:b64,branch:cfg.branch};if(cur&&cur.sha)body.sha=cur.sha;return ghFetch(cfg,ghPath(cfg,path),{method:'PUT',body:body})})}
function toB64(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function fromB64(b64){var bin=atob(b64.replace(/\s/g,'')),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}

function loginModal(){
  var g=guessRepo(),c=ghCfg()||{};
  var h='<h2>Sign in to edit</h2><p class="sub">Saving writes your changes to your GitHub repository. Your key stays in this browser only, so nobody else can save.</p><form id="gf" class="fields" novalidate>';
  h+='<div class="row2"><label class="f">GitHub username<input id="gf-owner" type="text" autocomplete="username" value="'+esc(c.owner||g.owner)+'"></label><label class="f">Repository<input id="gf-repo" type="text" value="'+esc(c.repo||g.repo)+'" placeholder="yourname.github.io"></label></div>';
  h+='<label class="f">GitHub key (personal access token) <small>Make one at github.com/settings/personal-access-tokens/new: give it access to only this repository, with Contents set to Read and write.</small><input id="gf-token" type="password" autocomplete="off" placeholder="github_pat_…"></label>';
  h+='<label class="f">Branch<input id="gf-branch" type="text" value="'+esc(c.branch||'main')+'"></label>';
  h+='<p class="err" id="gf-err"></p><div class="modal-actions"><a class="btn ghost" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create a key ↗</a><button class="btn ghost" type="button" id="gf-cancel">Cancel</button><button class="btn primary" type="submit" id="gf-go">Sign in</button></div></form>';
  openModal(h,function(m){
    $('#gf-cancel',m).addEventListener('click',closeModal);
    $('#gf',m).addEventListener('submit',function(e){e.preventDefault();
      var cfg={owner:$('#gf-owner',m).value.trim(),repo:$('#gf-repo',m).value.trim(),branch:$('#gf-branch',m).value.trim()||'main',token:$('#gf-token',m).value.trim()};
      var err=$('#gf-err',m);if(!cfg.owner||!cfg.repo||!cfg.token){err.textContent='Fill in your username, repository and key.';return}
      $('#gf-go',m).disabled=true;err.textContent='Checking your key…';
      ghFetch(cfg,'/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)).then(function(r){
        if(!r.permissions||!r.permissions.push)throw Object.assign(new Error('This key can read the repository but cannot save to it. Set Contents to Read and write.'),{status:403});
        ghSetCfg(cfg);closeModal();S.canEdit=true;S.editing=true;
        return loadFromGitHub(cfg).then(function(){render();toast('Signed in. You can edit now.')});
      }).catch(function(x){$('#gf-go',m).disabled=false;err.textContent=x.status===401?'GitHub rejected that key. Check you copied all of it.':x.status===404?'Repository not found. Check the username and repository name, and that the key has access to it.':(x.message||'Could not reach GitHub.')});
    });
  })}

function loadFromGitHub(cfg){return ghGet(cfg,'data.json').then(function(f){if(f&&f.content){var d=JSON.parse(fromB64(f.content));S.data=d;S.savedJSON=JSON.stringify(d)}})}

function save(){
  var cfg=ghCfg();if(!cfg)return loginModal();
  if(S.saving||!dirty())return;
  S.saving=true;render();
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify(S.data))}catch(e){}
  var data=clone(S.data),chain=Promise.resolve();
  data.projects.forEach(function(p){if(p.image&&p.image.indexOf('data:')===0){chain=chain.then(function(){var path='images/'+p.id+'-'+Date.now().toString(36)+'.jpg';return ghPut(cfg,path,p.image.split(',')[1],'Add cover image for '+p.title).then(function(){p.image=path})})}});
  chain.then(function(){return ghPut(cfg,'data.json',toB64(JSON.stringify(data,null,2)+'\n'),'Update site content')}).then(function(){
    S.data=data;S.savedJSON=JSON.stringify(data);S.saving=false;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
    render();toast('Saved. The public site updates in about a minute.');
  }).catch(function(e){
    S.saving=false;render();
    if(e.status===401){ghSetCfg(null);toast('Your GitHub key has expired or was removed. Sign in again, then save.');loginModal()}
    else if(e.status===403||e.status===404)toast('Your key cannot save to '+cfg.owner+'/'+cfg.repo+'. Check its Contents permission is Read and write.');
    else if(e.status===409||e.status===422)toast('The site changed somewhere else. Reload the page and try again. Your edits are kept.');
    else toast('Saving failed. Check your connection and try again. Your edits are kept.');
  });
}

/* ---------- toast ---------- */
var tt;function toast(msg){var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3800)}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.tab){e.preventDefault();S.tab=t.dataset.tab;try{history.replaceState(null,'','#'+S.tab)}catch(_){}render();var v=document.getElementById(S.tab);if(v&&window.scrollY>300)v.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.filter){S.filter=t.dataset.filter;render();return}
  if(t.id==='themeToggle')return toggleTheme();
  if(t.dataset.copy!=null){var v=t.dataset.copy;var cp=navigator.clipboard&&navigator.clipboard.writeText(v);if(cp)cp.then(function(){toast('Copied.')},function(){toast(v)});else toast(v);return}
  if(t.id==='copyMail'){var m=S.data.profile.email;var p=navigator.clipboard&&navigator.clipboard.writeText(m);if(p)p.then(function(){toast('Email copied.')},function(){selectMail()});else selectMail();return}
  if(t.id==='startEdit'){S.editing=true;render();return}
  if(t.id==='stopEdit'){S.editing=false;S.confirmDel=null;render();if(dirty())toast('You still have unsaved changes. Choose Edit site, then Save.');return}
  if(t.id==='addLink')return linkModal(null);
  if(t.id==='editProfile')return profileModal();
  if(t.id==='discard'){S.data=JSON.parse(S.savedJSON);S.confirmDel=null;render();toast('Changes discarded.');return}
  if(t.id==='save')return save();
  if(t.id==='signOut'){ghSetCfg(null);S.canEdit=false;S.editing=false;render();toast(dirty()?'Signed out. Unsaved changes stay in this tab until you reload.':'Signed out.');return}
  if(t.id==='restore'){S.data=S.draft;S.draft=null;S.editing=true;render();toast('Earlier edits restored. Save when ready.');return}
  if(t.id==='dropDraft'){S.draft=null;try{localStorage.removeItem(DRAFT_KEY)}catch(_){}render();return}
  if(t.dataset.edit!=null)return linkModal(+t.dataset.edit);
  if(t.dataset.askdel){S.confirmDel=t.dataset.askdel;render();setTimeout(function(){if(S.confirmDel===t.dataset.askdel){S.confirmDel=null;render()}},4000);return}
  if(t.dataset.del!=null){S.data.projects.splice(+t.dataset.del,1);S.confirmDel=null;render();return}
  if(t.dataset.move){var i=+t.dataset.i,j=i+(+t.dataset.move),arr=S.data.projects;if(j<0||j>=arr.length)return;var x=arr[i];arr[i]=arr[j];arr[j]=x;render();return}
});
document.addEventListener('submit',function(e){if(e.target.id==='quick'){e.preventDefault();var u=safeUrl($('#quickUrl').value);if(!u){toast('Paste a website link first, e.g. mysite.com');return}linkModal(null,u)}});
function selectMail(){var c=$('.mail code');if(!c)return;var r=document.createRange();r.selectNodeContents(c);var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Email selected. Press Ctrl+C to copy.')}
window.addEventListener('hashchange',function(){if(location.hash==='#edit'){if(ghCfg()){S.canEdit=true;S.editing=true;render()}else loginModal();return}var t=location.hash==='#about'?'about':'projects';if(t!==S.tab){S.tab=t;render()}});

/* ---------- start ---------- */
function boot(){
  var cfg=ghCfg();
  var load=cfg?loadFromGitHub(cfg).catch(function(){return loadPublic()}):loadPublic();
  load.then(function(){
    if(!S.data){S.loadMsg='The site content could not be loaded. Refresh the page to try again.';render();return}
    if(cfg){S.canEdit=true;try{var raw=localStorage.getItem(DRAFT_KEY);if(raw){if(raw===S.savedJSON)localStorage.removeItem(DRAFT_KEY);else S.draft=JSON.parse(raw)}}catch(e){}}
    render();
    if(location.hash==='#edit'){if(cfg){S.editing=true;render()}else loginModal()}
  });
}
function loadPublic(){return fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){S.data=d;S.savedJSON=JSON.stringify(d)}).catch(function(){})}
boot();
})();
</script>
</body>
